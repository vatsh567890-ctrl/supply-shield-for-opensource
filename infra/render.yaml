services:
  - type: web
    name: supplyshield-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    buildCommand: ""
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: supplyshield-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: supplyshield-redis
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false
      - key: LLM_PROVIDER
        value: none
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-1.5-pro

  - type: worker
    name: supplyshield-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    buildCommand: ""
    startCommand: "python -m app.worker.main"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: supplyshield-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: supplyshield-redis
          property: connectionString
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: LLM_PROVIDER
        value: none
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-1.5-pro

databases:
  - name: supplyshield-postgres
    plan: standard
    databaseName: supplyshield
    user: supplyshield

  - name: supplyshield-redis
    plan: standard
    ipAllowList: []
