services:
  postgres:
    image: postgres:16-alpine
    container_name: supplyshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supplyshield
      POSTGRES_PASSWORD: supplyshield
      POSTGRES_DB: supplyshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplyshield -d supplyshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supplyshield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supplyshield-api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://supplyshield:supplyshield@postgres:5432/supplyshield
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supplyshield-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.main"]
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://supplyshield:supplyshield@postgres:5432/supplyshield
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
