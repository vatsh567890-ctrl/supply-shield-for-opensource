[project]
name = "supplyshield"
version = "0.1.0"
description = "Pre-merge security scanner for open-source pull requests and dependency updates"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.0.0",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "httpx>=0.27.2",
    "pyjwt[crypto]>=2.9.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "lightgbm>=4.5.0",
    "xgboost>=2.1.0",
    "shap>=0.46.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "hypothesis>=6.115.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12.20240917",
    "types-redis>=4.6.0.20241004",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
mypy_path = [".", ".."]

[[tool.mypy.overrides]]
module = ["app.security.*", "app.analyzer.*"]
strict = true

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "lightgbm.*", "shap.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", ".."]
testpaths = ["tests"]
python_files = ["test_*.py"]
